{{define "content"}}
<div id="navbar"
     hx-get="/component/navbar"
     hx-trigger="load"></div>

<div class="container-fluid">
     <div class="row">
          <aside id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
               <div id="sidebar"
                    hx-get="/component/sidebar"
                    hx-trigger="load"></div>
          </aside>
          <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
               <div id="content"
                    hx-get="{{ .ComponentUrl }}"
                    hx-trigger="load"></div>
          </main>
     </div>
</div>
{{end}}
