<wa-card>
  <h4 slot="header"
      class="m-b-0">
    {{ .Model.Title }}
    </h3>
    <wa-markdown>
      <script type="text/markdown">
{{ .Model.Message }}
    </script>
    </wa-markdown>
    {{if .Model.IsToolRequest}}
    <div slot="footer">
      <wa-button variant="brand">Submit</wa-button>
      <wa-button variant="brand">Cancel</wa-button>
    </div>
    {{end}}
</wa-card>
